<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Study Hub</title>
    
    <link rel="stylesheet" href="css/style.css">

    <script>
        (function() {
            const myPassword = "970808"; 
            if (sessionStorage.getItem("isAllowed") === "true") {
                return;
            }
            const entry = prompt("비밀번호를 입력하세요.");
            if (entry === myPassword) {
                sessionStorage.setItem("isAllowed", "true");
            } else {
                alert("접근 권한이 없습니다.");
                window.location.href = "https://www.google.com";
            }
        })();
    </script>
</head>
<body>
    <header class="header">
        <button id="menuBtn" class="menu-btn">☰</button>
        <h1 class="app-title">English Study Hub</h1>
    </header>
    
    <div class="layout">
        <nav id="sidebar" class="sidebar">
            <ul>
                <li data-view="dates">📅 공부 기록</li>
                <li data-view="sentences">⭐ 필수 문장</li>
                <li data-view="test">🎲 랜덤 테스트</li>
                <li data-view="gemini">🤖 Gemini로 공부</li>
            </ul>
        </nav>
        <div id="overlay" class="overlay"></div>
        <main id="content" class="content"></main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script src="js/firebase-config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
